spring.application.name=MySpringBootApp
# port 번호 변경
#server.port=8085

# 사용자가 정의한 환경변수
myboot.age=${random.int(1,100)}
myboot.fullName=${myboot.name} Boot

# 현재 활성화된 환경을 나타내는 문자열설정
spring.profiles.active=prod

# log file
logging.file.path=logs

# CORS 허용 Origin ( 쉼표로 구분, 프론트엔드 개발서버 주소 )
app.cors.allowed-origins=http://localhost:3000,http://localhost:5173,http://127.0.0.1:5500
